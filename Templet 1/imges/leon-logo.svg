<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b9cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#005e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Letter L with geometric style -->
  <g>
    <!-- Vertical line of L -->
    <rect x="45" y="40" width="12" height="110" rx="6" fill="url(#grad1)"/>
    <!-- Horizontal line of L -->
    <rect x="45" y="140" width="65" height="12" rx="6" fill="url(#grad1)"/>
  </g>
  
  <!-- Letter E with geometric style -->
  <g transform="translate(130, 0)">
    <!-- Vertical line of E -->
    <rect x="0" y="40" width="12" height="110" rx="6" fill="url(#grad2)"/>
    <!-- Top horizontal line of E -->
    <rect x="0" y="40" width="50" height="12" rx="6" fill="url(#grad2)"/>
    <!-- Middle horizontal line of E -->
    <rect x="0" y="90" width="45" height="12" rx="6" fill="url(#grad2)"/>
    <!-- Bottom horizontal line of E -->
    <rect x="0" y="140" width="50" height="12" rx="6" fill="url(#grad2)"/>
  </g>
  
  <!-- Letter O (circle) -->
  <g transform="translate(65, 65)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#grad1)" stroke-width="10"/>
  </g>
  
  <!-- Letter N (diagonal lines) -->
  <g transform="translate(145, 60)">
    <!-- Left vertical line -->
    <rect x="0" y="0" width="10" height="90" rx="5" fill="url(#grad2)"/>
    <!-- Right vertical line -->
    <rect x="40" y="0" width="10" height="90" rx="5" fill="url(#grad2)"/>
    <!-- Diagonal line -->
    <line x1="5" y1="80" x2="45" y2="10" stroke="url(#grad2)" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Text "leon" below -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#grad1)">LEON</text>
</svg>
